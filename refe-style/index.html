<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
html,body{margin:0;background:#000;overflow:hidden;height:100%}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:contrast(1.12) saturate(0.85) brightness(0.94) hue-rotate(3deg) blur(0.2px)}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.10;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.5"/></svg>')}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%)}
</style>
</head>
<body>
<video src="assets/instagram.mp4" muted playsinline preload="auto" data-start="0" data-duration="15" data-end="15"></video>
<div class="grain"></div>
<div class="vignette"></div>
<script>
const tl = gsap.timeline({paused:true});
window.__timelines.main = tl;
</script>
</body>
</html>
