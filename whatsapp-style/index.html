<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Style</title>
<style>
  html,body{
    margin:0;
    padding:0;
    background:#000;
    overflow:hidden;
    height:100%;
  }
  body{
    --w:100vw;
    --h:100vh;
  }
  video{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:100vw;
    height:100vh;
    object-fit:contain;
    filter:
      contrast(1.08)
      saturate(0.88)
      brightness(0.96)
      hue-rotate(2deg)
      blur(0.15px);
  }
  .grain{
    position:absolute;
    inset:0;
    pointer-events:none;
    mix-blend-mode:soft-light;
    opacity:0.10;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.5"/></svg>');
  }
  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
  }
  .bars{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.18), rgba(0,0,0,0.18)) center/100% 8px repeat-y,
      linear-gradient(to right, rgba(0,0,0,0.12), rgba(0,0,0,0.12)) center/8px 100% repeat-x;
    mix-blend-mode:multiply;
    opacity:0.15;
  }
</style>
</head>
<body>
  <video src="assets/instagram.mp4" autoplay muted playsinline></video>
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="bars"></div>
</body>
</html>
