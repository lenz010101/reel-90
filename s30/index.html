<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Samsung — 30s</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #root { width:100%; height:100%; position:relative; font-family:system-ui, sans-serif; color:#fff; }
  .brand { position:absolute; left:6%; top:8%; font-size:30px; font-weight:700; letter-spacing:6px; opacity:0; }
  .device { position:absolute; left:50%; top:22%; width:460px; height:460px; }
  .tagline { position:absolute; left:6%; bottom:14%; font-size:26px; line-height:1.3; opacity:0; }
  .pulse { position:absolute; right:10%; top:30%; width:14px; height:14px; background:#FF3B4A; border-radius:50%; }
  .bar { position:absolute; left:12%; right:12%; bottom:6%; height:6px; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-duration="30">
  <div class="brand" id="brand">SAMSUNG</div>
  <div class="device" id="device">
    <svg viewBox="0 0 460 460" width="460" height="460">
      <rect x="10" y="10" width="440" height="440" rx="20" fill="#0a0a0a" />
    </svg>
  </div>
  <div class="tagline" id="tagline">THE FUTURE IS <br> IN YOUR HANDS</div>
  <div class="pulse" id="pulse"></div>
  <div class="bar" id="bar"></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#brand", { opacity: 0 }, { opacity: 0.9, duration: 3, ease: "power1.out" }, 0);
  tl.fromTo("#device", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 2, ease: "back.out(1.4)" }, 0);
  tl.fromTo("#tagline", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 1.4, ease: "power2.out" }, 0.5);
  tl.fromTo("#pulse", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 11.5);
  tl.to("#bar", { width: "100%", duration: 30, ease: "power2.out" }, 0);
  window.__timelines["root"] = tl;
</script>
</body>
</html>
