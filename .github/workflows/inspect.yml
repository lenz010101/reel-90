name: inspect

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Archivo a inspeccionar"
        required: false
        default: "assets/fuente-whatsapp.mp4"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache FFmpeg static
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64
      - name: Install FFmpeg static (solo si no hay cache)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg-static
          curl -fsSL -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe ~/ffmpeg-static/
      - name: FFmpeg al PATH
        run: echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
      - name: Extraer datos y fotogramas
        run: |
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,avg_frame_rate -of json "${{ inputs.file }}" > probe.json
          mkdir -p frames
          ffmpeg -i "${{ inputs.file }}" -vf "fps=1" -q:v 5 frames/f_%03d.jpg -y
      - name: Subir fotogramas
        uses: actions/upload-artifact@v4
        with:
          name: frames-inspeccion
          path: |
            probe.json
            frames/
