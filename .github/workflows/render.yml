name: render

on:
  workflow_dispatch:

jobs:
  check-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache hyperframes
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: hyperframes-0.8.92
      - name: Cache Puppeteer Chrome (saves ~1 min per run)
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-0.8.92
      - name: Install HyperFrames (pinned)
        run: npx --yes hyperframes@0.8.92 --version
      - name: Install FFmpeg static (fast, no apt)
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
      - name: Lint (guardia rápida — el check completo corre local antes de subir)
        run: npx --yes hyperframes@0.8.92 lint .
      - name: Render MP4
        run: npx --yes hyperframes@0.8.92 render . --skill=motion-graphics -q high --no-low-memory-mode --workers=2
        env:
          PRODUCER_EXPERIMENTAL_FAST_CAPTURE: "true"
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-90-mp4
          path: renders/**
