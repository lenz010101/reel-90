name: ffmpeg-match
on:
  workflow_dispatch:
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Process video
        run: |
          ls -R refe-style
          ffmpeg -y -i refe-style/assets/instagram.mp4 -c:v libx264 -crf 28 -preset fast -c:a aac -b:a 128k refe-style/output.mp4
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: refe-style-mp4
          path: refe-style/output.mp4