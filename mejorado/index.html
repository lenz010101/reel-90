<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #0d0d0f;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #root > video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 50%;
        z-index: 1;
      }
      #root > div {
        position: absolute;
        inset: 0;
        z-index: 3;
      }
      #t1 {
        top: 15% !important;
        inset: auto 7% auto 7% !important;
      }
      #t1 .word {
        display: inline-block;
        margin-right: 28px;
        font-size: 110px;
        line-height: 1.05;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -2px;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
      }
      #t1 .word.o {
        color: #f97316;
      }
      #t1 .bar {
        width: 260px;
        height: 16px;
        border-radius: 10px;
        background: #f97316;
        margin: 26px 0 22px;
        transform-origin: left center;
      }
      #t1 .sub {
        font-size: 48px;
        font-weight: 600;
        color: #ffe3c7;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      }
      .caption {
        display: flex;
        align-items: center;
        gap: 26px;
        top: auto !important;
        bottom: 15% !important;
        left: 7% !important;
        right: 7% !important;
        inset: auto 7% 15% 7% !important;
      }
      .caption .bar {
        flex: none;
        width: 14px;
        height: 120px;
        border-radius: 8px;
        background: #f97316;
        box-shadow: 0 6px 24px rgba(249, 115, 22, 0.55);
      }
      .caption .txt {
        font-size: 62px;
        line-height: 1.2;
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 4px 22px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.5);
      }
      .caption .txt small {
        display: block;
        font-size: 42px;
        font-weight: 600;
        color: #ffd9b8;
        margin-top: 10px;
      }
      #cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 44px;
        text-align: center;
        background: linear-gradient(160deg, #f97316 0%, #fb923c 55%, #fdba74 100%);
        opacity: 0;
        z-index: 4;
      }
      #cta .deco {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
      }
      #cta .d1 {
        width: 420px;
        height: 420px;
        top: -140px;
        left: -120px;
      }
      #cta .d2 {
        width: 300px;
        height: 300px;
        bottom: 120px;
        right: -90px;
      }
      #cta .d3 {
        width: 140px;
        height: 140px;
        top: 300px;
        right: 120px;
        background: rgba(120, 53, 15, 0.25);
      }
      #cta .emoji {
        font-size: 150px;
        line-height: 1;
      }
      #cta h1 {
        margin: 0;
        font-size: 128px;
        line-height: 1.05;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -2px;
        text-shadow: 0 8px 32px rgba(120, 53, 15, 0.45);
      }
      #cta p {
        margin: 0;
        font-size: 56px;
        font-weight: 700;
        color: #fff7ed;
      }
      #cta .pill {
        padding: 30px 64px;
        border-radius: 999px;
        background: #1c1917;
        color: #ffffff;
        font-size: 52px;
        font-weight: 800;
        box-shadow: 0 16px 40px rgba(28, 25, 23, 0.4);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13"
      data-width="1080"
      data-height="1920"
    >
      <!-- Tomas del video original (cortes continuos, audio original) -->
      <video
        id="va"
        src="assets/fuente.mp4"
        data-start="0"
        data-duration="2.4"
        data-media-start="0"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <video
        id="vb"
        src="assets/fuente.mp4"
        data-start="2.4"
        data-duration="2.2"
        data-media-start="2.4"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <video
        id="vc"
        src="assets/fuente.mp4"
        data-start="4.6"
        data-duration="1.8"
        data-media-start="4.6"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <video
        id="vd"
        src="assets/fuente.mp4"
        data-start="6.4"
        data-duration="2.4"
        data-media-start="6.4"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>
      <video
        id="ve"
        src="assets/fuente.mp4"
        data-start="8.8"
        data-duration="1.28"
        data-media-start="8.8"
        data-track-index="0"
        data-has-audio="true"
        playsinline
      ></video>

      <!-- Título de entrada -->
      <div id="t1" class="clip" data-start="0" data-duration="2.4" data-track-index="1">
        <div>
          <span class="word">EXPRIMIDOR</span>
          <span class="word o">PROFESIONAL</span>
        </div>
        <div class="bar"></div>
        <div class="sub">Uso comercial &middot; Alta demanda</div>
      </div>

      <!-- Rótulos por toma -->
      <div id="cap-b" class="clip caption" data-start="2.4" data-duration="2.2" data-track-index="1">
        <div class="bar"></div>
        <div class="txt">Encendido simple<small>Un botón y listo</small></div>
      </div>
      <div id="cap-c" class="clip caption" data-start="4.6" data-duration="1.8" data-track-index="1">
        <div class="bar"></div>
        <div class="txt">Doble rodillo<small>Máxima extracción de jugo</small></div>
      </div>
      <div id="cap-d" class="clip caption" data-start="6.4" data-duration="2.4" data-track-index="1">
        <div class="bar"></div>
        <div class="txt">Acero inoxidable<small>Pensada para tu negocio</small></div>
      </div>
      <div id="cap-e" class="clip caption" data-start="8.8" data-duration="1.28" data-track-index="1">
        <div class="bar"></div>
        <div class="txt">Lista para tu negocio</div>
      </div>

      <!-- Tarjeta final (motion graphics puro) -->
      <div id="cta" class="clip" data-start="ve" data-duration="2.92" data-track-index="1">
        <div class="deco d1"></div>
        <div class="deco d2"></div>
        <div class="deco d3"></div>
        <div class="emoji">🍊</div>
        <h1>PEDÍ EL TUYO HOY</h1>
        <p>Envíos a todo el país</p>
        <div class="pill">Consultá por WhatsApp</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Intro */
      tl.fromTo(
        "#t1 .word",
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, stagger: 0.12, duration: 0.5, ease: "power3.out" },
        0.15,
      );
      tl.fromTo("#t1 .bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.6);
      tl.fromTo("#t1 .sub", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.85);
      tl.to("#t1", { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, 1.95);

      /* Ken Burns por toma */
      tl.fromTo("#va", { scale: 1.0 }, { scale: 1.08, duration: 2.4, ease: "none" }, 0);
      tl.fromTo("#vb", { scale: 1.14 }, { scale: 1.02, duration: 2.2, ease: "none" }, 2.4);
      tl.fromTo("#vc", { scale: 1.05 }, { scale: 1.16, duration: 1.8, ease: "none" }, 4.6);
      tl.fromTo("#vd", { scale: 1.0 }, { scale: 1.1, duration: 2.4, ease: "none" }, 6.4);
      tl.fromTo("#ve", { scale: 1.08 }, { scale: 1.0, duration: 1.28, ease: "none" }, 8.8);

      /* Rótulos: entran y salen dentro de su propia toma */
      tl.fromTo("#cap-b", { y: 60 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.55);
      tl.to("#cap-b", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 4.2);
      tl.fromTo("#cap-c", { y: 60 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 4.75);
      tl.to("#cap-c", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 6.0);
      tl.fromTo("#cap-d", { y: 60 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.55);
      tl.to("#cap-d", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 8.4);
      tl.fromTo("#cap-e", { y: 60 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 8.95);
      tl.to("#cap-e", { opacity: 0, duration: 0.25, ease: "none" }, 9.85);

      /* Tarjeta final */
      tl.fromTo("#cta", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 10.08);
      tl.fromTo(
        "#cta .emoji",
        { scale: 0, rotation: -30 },
        { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" },
        10.3,
      );
      tl.fromTo(
        "#cta h1",
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        10.5,
      );
      tl.fromTo(
        "#cta p",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        10.9,
      );
      tl.fromTo(
        "#cta .pill",
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" },
        11.2,
      );
      tl.to("#cta .d1", { x: 90, y: 60, duration: 2.6, ease: "sine.inOut" }, 10.08);
      tl.to("#cta .d2", { x: -70, y: -50, duration: 2.6, ease: "sine.inOut" }, 10.08);
      tl.to("#cta .pill", { scale: 1.06, duration: 0.7, yoyo: true, repeat: 1, ease: "sine.inOut" }, 11.9);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
