<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #070b16;
      color: #eaf0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    h1 {
      font-size: 80px;
      z-index: 10;
      opacity: 0;
      transform: translateY(50px);
    }
    p.subtitle {
      font-size: 30px;
      z-index: 10;
      opacity: 0;
      margin-top: 20px;
    }
    .orb {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      z-index: 1;
    }
    .orb-1 { background: #2f6bff; top: -100px; left: -100px; }
    .orb-2 { background: #00d4c7; bottom: -100px; right: -100px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <h1 id="title">HyperFrames</h1>
    <p class="subtitle" id="subtitle">Renderizado desde la nube ðŸš€</p>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    
    tl.to("#title", {
      opacity: 1,
      y: 0,
      duration: 1.5,
      ease: "power4.out"
    })
    .to("#subtitle", {
      opacity: 1,
      duration: 1,
    }, "-=0.5");

    tl.to(".orb", {
      x: 100,
      y: 50,
      duration: 3,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });

    // Exponemos la timeline para HyperFrames
    window.__timelines.main = tl;
  </script>
</body>
</html>
